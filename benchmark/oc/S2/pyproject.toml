[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmanager"
version = "0.1.0"
description = "A minimal, dependency-free task manager library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["todo", "task", "taskmanager", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/yourname/taskmanager"
Repository = "https://github.com/yourname/taskmanager"

[tool.setuptools]
py-modules = ["todo", "config"]

[tool.pytest.ini_options]
testpaths = ["test_todo.py"]
