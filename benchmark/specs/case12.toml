# case12 OLED I2C —— 权重 8，时间盒 30min
#
# judge_table 判据：
#   F1  OLED 出现画面，无花屏无反影（1.5）
#   F2  行1 `G431RB`、行2 `UP <n>` 每秒递增
#   F3  上电 2s 内出画面（0.5）
#   H1  地址处理正确（0x3C 左移成 0x78）
#   H2  初始化含 charge pump(0x8D/0x14)、display on(0xAF)；I2C1 配 AF 开漏
#
# 这台机器能做的与不能做的，分开说清：
# * **能**：相机量"有没有画面、画面在不在变"；分析仪解 I2C 看真实写到
#   总线上的**字节**（从机地址、0x8D/0x14、0xAF）—— 这比截图硬，因为它
#   不依赖你信不信那张图。
# * **不能**：从 I2C 字节流还原屏幕上的**文字**（要同时知道字模库和 SSD1306
#   的寻址方式才能反推），也**不能**可靠地卡"上电 2 秒"—— ffmpeg 起流本身有
#   0.5–1s 的不确定度，和 2 秒的判据同量级。这两件事都交 AI，报告里带上
#   时间线与截图，而不是用一个看起来很确定的绿灯糊过去。
#
# 接线：OLED VCC→3V3、GND→GND、SCL→PB8(D15)、SDA→PB9(D14)。
# 分析仪的 SCL/SDA 通道号写在 config.toml 的 [la.decoders] / [la.channel_map]，
# 不写在规格里 —— 它取决于你怎么夹线。

id = "case12"
title = "OLED"
weight = 8
timebox_min = 30

[caps]
flash = true
reset = "swd"
camera = true
la = true

[fallback]
on_missing = "skip"

[[steps]]
op = "flash"

[[steps]]
op = "reset"
kind = "auto"

# 第一段：录下开机后的头几秒
[[steps]]
op = "frame_burst"
duration_ms = 7000
fps = 20
save = "case12-boot"
asserts = [
  { id = "F1a", point = "F1", type = "brightness", min_lit_fraction = 0.02 },
  { id = "F1b", point = "F1", type = "motion", min_changed_fraction = 0.002 },
]

# 第二段：确认是持续刷新，而不是开机残影
[[steps]]
op = "frame_burst"
duration_ms = 5000
fps = 20
save = "case12-steady"
asserts = [
  { id = "F1c", point = "F1", type = "motion", min_changed_fraction = 0.002 },
]

# 相机机位现在拍不到板子，屏幕这一环由人看。两问都是**逐字固定**的，
# 两个 agent 一模一样；回答连时间戳落盘，评委引用时看得见它来自人工观测。
[[steps]]
op = "manual_observe"
point = "F1"
question = "刚才 reset 之后，OLED 是多久出现内容的？（2秒内 / 超过2秒 / 从未出现 / 没看到复位瞬间）"
choices = ["2秒内", "超过2秒", "从未出现", "没看到复位瞬间"]
timeout_s = 180

[[steps]]
op = "manual_observe"
point = "F2"
question = "现在请照抄 OLED 屏幕上显示的每一行文字（原样，含数字）。看不清就答『看不清』。"
timeout_s = 240

# 分析仪解 I2C：看真实写到总线上的字节
[[steps]]
op = "la_capture"
duration_ms = 1500
driver = "auto"
samplerate = "4m"
asserts = [
  # 从机地址 0x78（= 0x3C<<1）出现，说明地址处理对了
  { id = "H2a", point = "H2", type = "decoded_contains", decoder = "i2c", channel = "PB8", pattern = "78" },
  # charge pump 设置
  { id = "H2b", point = "H2", type = "decoded_contains", decoder = "i2c", channel = "PB8", pattern = "8[dD]" },
  # display on
  { id = "H2c", point = "H2", type = "decoded_contains", decoder = "i2c", channel = "PB8", pattern = "[aA][fF]" },
]

[[steps]]
op = "check"
asserts = [
  { id = "H2d", point = "H2", type = "code_static", rule = "case12.H2" },
]

[[steps]]
op = "ai_judge"
points = ["F2", "F3", "H1"]
evidence = ["camera", "manual", "la", "diff", "session"]
note = "F2 屏幕文字的依据：人工观测记录（机位可用时再看截图）；F3 的 2 秒时序看 first_lit 时间线（仪器不确定度已在报告里注明）；H1 要判『理性发现』还是『瞎蒙蒙对』"
