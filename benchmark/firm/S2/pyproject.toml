[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-task-manager"
version = "0.1.0"
description = "A minimal task manager library with JSON persistence."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["todo", "task", "task-manager", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
py-modules = ["todo", "config"]

[tool.pytest.ini_options]
testpaths = ["test_todo.py"]
