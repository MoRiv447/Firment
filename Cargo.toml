[workspace]
resolver = "2"
members = [
    "crates/firment-core",
    "crates/firment-tools",
    "crates/firment-tui",
    "crates/firment-cli",
]

[workspace.package]
version = "1.0.0-rc3"
edition = "2024"
# 1.89 是 `probe-rs 0.32` 的下限。抬它是一次有意的取舍：把探针从"调 CLI"
# 换成"链接库"（会话常驻、结构化错误、RTT），代价是 1.85–1.88 的工具链不能构建。
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
arboard = "3"
async-stream = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.28"
chrono = "0.4"
dirs = "5"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
image = "0.25"
# default-features 里带 `compression`（ruzstd）—— 2026-10 它挂着一条 HIGH 通告
# （RUSTSEC-2026-0344，解压炸弹），而仓库里没有任何代码调解压 API：关掉它。
# 只用 builtin-targets（按芯片名解析）+ cmsisdap_v1（ST-Link）；
# coredump / builtin-formats 等默认项暂时不要，编译时间优先。
probe-rs = { version = "0.32", default-features = false, features = ["builtin-targets", "cmsisdap_v1"] }
object = { version = "0.36", default-features = false, features = ["read_core", "write", "std"] }
ratatui = "0.29"
serialport = "4"
sha2 = "0.10"
regex = "1"
# native-tls over rustls: rustls refuses TLS renegotiation, and
# proxy/SSL-interception middleboxes (Clash, corporate inspection) trigger
# exactly that — reqwest then reports a bare "error sending request" with no
# way in. native-tls uses the OS stack (Schannel/Security.framework/OpenSSL),
# which handles renegotiation AND trusts CA certs the user installed for
# their proxy. The extra features restore what default-features=false drops:
# charset (.text() decoding — GBK pages), http2, macOS system-proxy detection
# (GUI launched from Finder has no shell env), and socks proxies.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "charset", "http2", "macos-system-configuration", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }
wiremock = "0.6"
