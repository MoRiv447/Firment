[workspace]
resolver = "2"
members = [
    "crates/firment-core",
    "crates/firment-tools",
    "crates/firment-tui",
    "crates/firment-cli",
]

[workspace.package]
version = "0.5.6"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
arboard = "3"
async-stream = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.28"
chrono = "0.4"
dirs = "5"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
object = "0.36"
ratatui = "0.29"
serialport = "4"
sha2 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }
wiremock = "0.6"
