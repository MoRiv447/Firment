<!doctype html>
<html lang="en" data-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/logo-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The scheme, decided before first paint.

      The old block here hand-copied four colours out of styles/tokens.ts
      because nothing could run to read them, and resolved the scheme from
      `prefers-color-scheme` -- so a pinned `ui.theme = light` on a dark machine
      painted dark until React got there. Both problems are gone: the values now
      come from tokens.css through the links below, and the decision comes from
      the same localStorage cache React writes.

      `data-scheme="dark"` on <html> is the no-JS fallback. Without it a blocked
      script would leave every var(--*) unresolved and the whole window black on
      black; with it, a failed script degrades to "dark until React says
      otherwise", which is what used to happen on purpose.
    -->
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <script>
      // Requires `csp: null` in src-tauri/tauri.conf.json. If a Content-Security-Policy
      // is ever added, this inline script is silently blocked and the app falls back to
      // the attribute above -- i.e. the flash comes back with no error anywhere. Move
      // this into a linked .js file at the same point in <head> rather than deleting it.
      (function () {
        try {
          var raw = localStorage.getItem('firment.ui.theme');
          var setting = (raw || 'auto').trim().toLowerCase();
          var systemDark = !(
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
          );
          // Mirrors resolveTheme() in src/lib/theme.ts: an unknown value behaves
          // as `auto` rather than pinning a scheme nobody asked for.
          var mode =
            setting === 'light' ? 'light' : setting === 'dark' ? 'dark' : systemDark ? 'dark' : 'light';
          document.documentElement.dataset.scheme = mode;
          var cached = localStorage.getItem('firment.scheme.resolved');
          if (mode !== cached) localStorage.setItem('firment.scheme.resolved', mode);
        } catch (e) {
          /* private mode, a blocked store, no localStorage: keep the fallback attribute */
        }
      })();
    </script>
    <title>Firment GUI</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
