# Firment HIL example — copy to .firment/hil.toml and adapt
# Each suite is an ordered recipe: build → flash → monitor (with expectations) → elf_analyze
# Run: `firm hil --suite blink`  or via the agent: hil(suite="blink")
# Dry-run (no hardware): `firm hil --suite blink --dry-run`
# Replay: `firm hil --replay list` / `firm hil --replay <id>`

[suite.blink]
chip = "stm32g431rb"          # probe-rs chip id
port = "auto"                 # auto = first detected serial port; or "COM3" / "/dev/ttyUSB0"
elf = "build/firmware.elf"    # used by flash/run/elf steps when they omit file/elf

[[suite.blink.steps]]
kind = "build"                # auto-detects platformio.ini / Makefile / CMakeLists.txt / *.uvprojx
timeout_ms = 600000

[[suite.blink.steps]]
kind = "flash"
elf = "build/firmware.elf"    # must be inside workspace; chip comes from suite.chip
timeout_ms = 180000
# reset = true                # default true: reset after flash so firmware starts

[[suite.blink.steps]]
kind = "monitor"
timeout_ms = 5000
expect_contains = "LED ON"    # pass when this string appears at least expect_count times
expect_count = 2
# expect_regex = "LED (ON|OFF)"  # alternative: regex
# baud = 115200
# autodetect = false          # true to probe 9600..921600

[[suite.blink.steps]]
kind = "elf_analyze"
elf = "build/firmware.elf"

# Second suite: RTT streaming (uses probe-rs run instead of serial monitor)
[suite.rtt]
chip = "stm32f407vetx"
elf = "build/firmware.elf"

[[suite.rtt.steps]]
kind = "build"

[[suite.rtt.steps]]
kind = "run"
elf = "build/firmware.elf"
timeout_ms = 5000

[[suite.rtt.steps]]
kind = "elf_analyze"
elf = "build/firmware.elf"

# Third suite: ITM/SWO trace (STM32G4 example — needs ITM_SendChar in firmware)
[suite.trace]
chip = "stm32g431rb"
elf = ".pio/build/nucleo_g431rb/firmware.elf"  # auto-inferred if omitted

[[suite.trace.steps]]
kind = "build"

[[suite.trace.steps]]
kind = "flash"
# elf auto-inferred as .pio/build/nucleo_g431rb/firmware.elf when omitted

[[suite.trace.steps]]
kind = "trace"
duration_ms = 3000
clk_hz = 170000000   # HCLK feeding TPIU/SWO
baud = 2000000
expect_contains = "counter="   # optional: hil checks captured trace against expect
expect_count = 2

# Inline steps (no .firment/hil.toml needed) — agent/CLI can do:
# firm hil --steps '[{"kind":"build"},{"kind":"monitor","expect_contains":"ok","timeout_ms":3000}]' --dry-run

# Physical observation (v0.7+): assert the LED is lit on a photo of the
# board. The analysis is deterministic local CV — no vision model. Run a
# first observe step WITHOUT expect_lit to get a `suggested roi`, then pin
# it for repeat runs.
[suite.observe-photo]
chip = "stm32g431rb"

[[suite.observe-photo.steps]]
kind = "build"
timeout_ms = 600000

[[suite.observe-photo.steps]]
kind = "flash"
elf = "build/firmware.elf"
timeout_ms = 180000

[[suite.observe-photo.steps]]
kind = "delay"
duration_ms = 500

[[suite.observe-photo.steps]]
kind = "observe"
file = "photos/led-on.jpg"     # inside the workspace
roi = [120, 80, 40, 40]        # optional: point at the LED; omit to scan
expect_lit = true              # fail the suite if the analysis says dark
save = true                    # archive the frame under .firment/observe/

# Fifth suite: blink measurement (v0.7.2+). Phone burst mode works — copy
# the shots into the workspace IN CAPTURE ORDER, then give interval_ms (the
# gap between shots, which only you know). The analysis never guesses a
# time base, so expect_blink_hz REQUIRES interval_ms.
[suite.blink-observe]
chip = "stm32g431rb"

[[suite.blink-observe.steps]]
kind = "build"
timeout_ms = 600000

[[suite.blink-observe.steps]]
kind = "flash"
elf = "build/firmware.elf"
timeout_ms = 180000

[[suite.blink-observe.steps]]
kind = "delay"
duration_ms = 500

[[suite.blink-observe.steps]]
kind = "observe"
mode = "blink"
paths = [
  "photos/blink-0.jpg",
  "photos/blink-1.jpg",
  "photos/blink-2.jpg",
  "photos/blink-3.jpg",
  "photos/blink-4.jpg",
  "photos/blink-5.jpg",
  "photos/blink-6.jpg",
  "photos/blink-7.jpg",
  "photos/blink-8.jpg",
  "photos/blink-9.jpg",
]
interval_ms = 100              # your burst rate — REQUIRED for expect_blink_hz
# roi = [120, 80, 40, 40]      # optional, point at the LED
expect_blinking = true         # plain boolean: does it alternate at all
expect_blink_hz = 2.5          # strict: must be inside the measured range,
                               # non-LOW confidence, interval_ms present

# ---------------------------------------------------------------------------
# la: logic-analyzer waveform assertions (v0.8.0) — rung 5, measured not
# asserted. Requires sigrok-cli installed and [tools.la] driver configured
# (or driver= on the step). A LOW-confidence measurement can never pass.
# ---------------------------------------------------------------------------
[suite.uart-clock]
chip = "stm32g431rb"

[[suite.uart-clock.steps]]
kind = "build"

[[suite.uart-clock.steps]]
kind = "flash"
elf = "build/firmware.elf"
timeout_ms = 180000

[[suite.uart-clock.steps]]
# Capture 400k samples of channel 0 at 8 MHz and assert the PWM on it.
kind = "la"
channels = "D0,D1"
samplerate = "8m"
samples = 400000
channel = 0
expect_frequency_hz = 1000000.0   # must sit inside the measured range
expect_duty = 0.5                 # ±10 percentage points

[[suite.uart-clock.steps]]
# Decode the UART line from a stored capture (or capture again): the text
# sigrok's decoder puts on the wire must contain the expected payload.
kind = "la"
channels = "D0,D1"
samplerate = "8m"
samples = 800000
decoder = "uart"
decoder_opts = { rx = "1", baudrate = "115200" }
expect_decoded = "BOOT-OK"
