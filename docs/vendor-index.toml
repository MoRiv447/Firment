# Firment 硬件知识库 — 机器可读索引（seed KB）
# 消费顺序（务必逐层，勿一次 read 整个 docs/，否则等于把知识库全量塞回 context）：
#   1) read_file("docs/vendor-index.toml")            -> 找到目标 family / topic
#   2) read_file("docs/cheatsheets/<file>.toml")       -> 取原创高频速查
#   3) 仅当需具体位域/更深层细节，才按 reference_manual.url 拉官方手册做 RAG
# 规则：只放可确认事实；速查内容必须原创，禁止搬运厂商文档原文。
# 注：本 seed KB 随 Firment 发布；真实项目知识库应放在你的项目工作区 docs/（规则见 vendor-index.md）。

[meta]
schema_version = "1"
description = "轻量索引 + 结构化速查，给 firm 提供嵌入式领域特长。手册本身不入库，仅存官方入口 URL。"

# ───────────────────────── STM32 ─────────────────────────
[stm32.f4]
family = "STM32F4xx"
reference_manual = { name = "RM0090", url = "https://www.st.com/resource/en/reference_manual/rm0090-stm32f405415-stm32f407417-stm32f427437-and-stm32f429439-advanced-armbased-32bit-mcus-stmicroelectronics.pdf", pages = 1704 }
hal_repo = "https://github.com/STMicroelectronics/STM32CubeF4"
hal_header_path = "Drivers/STM32F4xx_HAL_Driver/Inc/stm32f4xx_hal_dma.h"
sdk_version = "STM32CubeF4 HAL v1.8.x"
last_reviewed = "2026-08-08"

[[stm32.f4.quickref]]
topic = "DMA 配置"
cheatsheet = "cheatsheets/stm32-dma.toml"
doc_section = "RM0090 Section 10.3"
hal_functions = ["HAL_DMA_Init", "HAL_DMA_Start_IT", "HAL_DMA_Start", "HAL_DMA_Abort"]
key_registers = ["DMA_SxCR", "DMA_SxNDTR", "DMA_SxPAR", "DMA_SxM0AR"]
confidence = "verified"
notes = "DMA1 主接口挂 AHB1（可经桥接访问 APB1/APB2 外设），DMA2 挂 AHB2（含 USB OTG HS / ETH / DCMI）。需 DMA 搬 USB/ETH/DCMI 数据必须用 DMA2 的 stream。"

[[stm32.f4.quickref]]
topic = "时钟树"
cheatsheet = "cheatsheets/stm32-clock.toml"
doc_section = "RM0090 Section 6.2"
key_concepts = ["SYSCLK", "HCLK", "PCLK1", "PCLK2", "PLL"]
confidence = "verified"
common_mistake = ["APB1/APB2 上的定时器时钟在对应 APB 预分频 ≠ 1 时为 PCLK×2；按 PCLK1=42MHz 直接算 TIM 频率会少算一倍（实际 84MHz）。"]

# ───────────────────────── ESP32 ─────────────────────────
[esp32]
family = "ESP32 (ESP32-D0WD / ESP32-D0WDQ6)"
reference_manual = { name = "ESP32 Technical Reference Manual", url = "https://www.espressif.com/sites/default/files/documentation/esp32_technical_reference_manual_en.pdf", pages = 850 }
hal_repo = "https://github.com/espressif/esp-idf"
sdk_version = "ESP-IDF v5.x"
last_reviewed = "2026-08-08"

[[esp32.quickref]]
topic = "GPIO"
cheatsheet = "cheatsheets/esp32-gpio.toml"
doc_section = "ESP32 TRM Section 5 (GPIO and IOMUX)"
key_registers = ["GPIO_OUT", "GPIO_IN", "GPIO_ENABLE", "GPIO_<n>_CFG"]
confidence = "verified"
common_mistake = ["GPIO 34-39 为输入专用，不能输出或内部上下拉；strapping 引脚（GPIO 0/2/5/12/15 等）上电电平决定启动模式，强拉可能砖机或无法下载。"]

# ───────────────────────── STM32 F1 ─────────────────────────
[stm32.f1]
family = "STM32F1xx (F103)"
reference_manual = { name = "RM0008", url = "https://www.st.com/resource/en/reference_manual/rm0008-stm32f101xx-stm32f102xx-stm32f103xx-stm32f105xx-and-stm32f107xx-advanced-armbased-32bit-mcus-stmicroelectronics.pdf", pages = 1128 }
hal_repo = "https://github.com/STMicroelectronics/STM32CubeF1"
sdk_version = "STM32CubeF1 HAL v1.8.x"
last_reviewed = "2026-08-08"

[[stm32.f1.quickref]]
topic = "USART / DMA"
cheatsheet = "cheatsheets/stm32f1-uart.toml"
doc_section = "RM0008 Section 18/22"
hal_functions = ["HAL_UART_Transmit_DMA", "HAL_UART_Receive_DMA"]
key_registers = ["USART_BRR", "DMA_CCR", "DMA_CNDTR"]
confidence = "verified"
notes = "F103 只有 DMA1（7 通道），USART1_TX=Ch4、RX=Ch5；USART2/3 用 PCLK1=36MHz 算波特率"

[[stm32.f1.quickref]]
topic = "TIM / PWM"
cheatsheet = "cheatsheets/stm32f1-tim.toml"
doc_section = "RM0008 Section 13/14"
hal_functions = ["HAL_TIM_PWM_Start", "__HAL_TIM_SET_COMPARE"]
key_registers = ["TIMx_PSC", "TIMx_ARR", "TIMx_CCR1"]
confidence = "verified"
notes = "APB1 预分频≠1 时 TIM2-4 时钟 = PCLK1×2（典型 72MHz）；TIM1 互补输出需 MOE"

[[stm32.f1.quickref]]
topic = "时钟树"
cheatsheet = "cheatsheets/stm32f1-clock.toml"
doc_section = "RM0008 Section 7"
key_concepts = ["SYSCLK", "HCLK", "PCLK1", "PCLK2", "PLL"]
confidence = "verified"
common_mistake = ["F103 上限 72MHz：APB1≤36MHz、APB2≤72MHz；72MHz 需 Flash latency=2"]

# ───────────────────────── STM32 G0 ─────────────────────────
[stm32.g0]
family = "STM32G0xx"
reference_manual = { name = "RM0444", url = "https://www.st.com/resource/en/reference_manual/rm0444-stm32g0x1-advanced-armbased-32-bit-mcus-stmicroelectronics.pdf", pages = 1500 }
hal_repo = "https://github.com/STMicroelectronics/STM32CubeG0"
sdk_version = "STM32CubeG0 HAL v1.x"
last_reviewed = "2026-08-08"

[[stm32.g0.quickref]]
topic = "GPIO / EXTI"
cheatsheet = "cheatsheets/stm32g0-gpio.toml"
doc_section = "RM0444 GPIO/EXTI"
key_concepts = ["5V 容忍（按 datasheet FT 标记）", "EXTI 唤醒"]
confidence = "verified"
notes = "SYSCLK 最高 64MHz；STOP 唤醒需 EXTI 线路 + 时钟都使能"

[[stm32.g0.quickref]]
topic = "USART / LPUART"
cheatsheet = "cheatsheets/stm32g0-uart.toml"
doc_section = "RM0444 USART/LPUART"
hal_functions = ["HAL_UART_Init", "HAL_LPUART_Init"]
confidence = "verified"
common_mistake = ["LPUART 用 LSE 32.768kHz 时波特率受限；USART 时钟源（PCLK/HSI16/LSE）要先选对"]

# ───────────────────────── ESP32-S3 ─────────────────────────
[esp32.s3]
family = "ESP32-S3"
reference_manual = { name = "ESP32-S3 Technical Reference Manual", url = "https://www.espressif.com/sites/default/files/documentation/esp32-s3_technical_reference_manual_en.pdf", pages = 1200 }
hal_repo = "https://github.com/espressif/esp-idf"
sdk_version = "ESP-IDF v5.x"
last_reviewed = "2026-08-08"

[[esp32.s3.quickref]]
topic = "GPIO"
cheatsheet = "cheatsheets/esp32s3-gpio.toml"
doc_section = "ESP32-S3 TRM GPIO"
key_pins = ["GPIO0/3/45/46 strapping", "GPIO19/20 USB-Serial/JTAG", "GPIO43/44 默认 UART0 console"]
confidence = "verified"
notes = "45 个 GPIO（0-21、26-48）；多数不 5V 容忍；占用 43/44 会丢默认 console"

[[esp32.s3.quickref]]
topic = "UART / USB-Serial"
cheatsheet = "cheatsheets/esp32s3-uart.toml"
doc_section = "ESP32-S3 TRM UART"
hal_functions = ["uart_driver_install", "uart_write_bytes"]
confidence = "verified"
common_mistake = ["log 同时开 UART0 和 USB-CDC 输出混乱；monitor 默认 115200"]
