[[stm32.h7.quickref]]
topic = "USART / DMA / D-Cache coherency"
cheatsheet = "cheatsheets/stm32h7-uart.toml"
doc_section = "RM0468 Section 33 (USART) / 22 (DMA) / cache + MPU"
hal_functions = ["HAL_UART_Transmit_DMA", "SCB_CleanDCache_by_Addr", "SCB_InvalidateDCache_by_Addr"]
key_registers = ["SCB_CTRL", "MPU_RNR", "MPU_RBAR"]
confidence = "verified"
notes = "D-Cache coherency is the #1 H7 bug: clean before DMA TX, invalidate after DMA RX, or make shared buffers non-cacheable via MPU"
