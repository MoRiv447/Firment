# ───────────────────────── STM32G4 ─────────────────────────
[stm32.g4]
family = "STM32G4xx (G431/G474, Cortex-M4F)"
reference_manual = { name = "RM0440", url = "https://www.st.com/resource/en/reference_manual/rm0440-stm32g4-series-advanced-armbased-32bit-mcus-stmicroelectronics.pdf", pages = 1734 }
hal_repo = "https://github.com/STMicroelectronics/STM32CubeG4"
sdk_version = "STM32CubeG4 HAL v1.5.x"
last_reviewed = "2026-08-12"

[[stm32.g4.quickref]]
topic = "USART / DMA (DMAMUX)"
cheatsheet = "cheatsheets/stm32g4-uart.toml"
doc_section = "RM0440 Section 28 (USART) / 19 (DMA+DMAMUX)"
hal_functions = ["HAL_UART_Transmit_DMA", "HAL_UART_Receive_DMA", "HAL_DMA_Init"]
key_registers = ["DMAMUX1_REQ0..REQx", "DMA_SxCR", "USART_BRR"]
confidence = "verified"
notes = "G4 has NO fixed DMA channel mapping — requests route through DMAMUX1; compute BRR from the actual PCLK1/PCLK2"

[[stm32.g4.quickref]]
topic = "Pinout / package"
cheatsheet = "cheatsheets/stm32g4-pinout.toml"
doc_section = "DS12589 pinout / UM2505 (NUCLEO-G431RB)"
confidence = "verified"
common_mistake = ["G431RB (LQFP64) has NO Port E — any PE* pin compiles but drives nothing (phantom-pin trap); NUCLEO: LED=PA5, button=PC13, ST-Link VCP=LPUART1 PA2/PA3; 5V tolerance is per-pin (FT vs TT_a)."]

[[stm32.g4.quickref]]
topic = "TIM / PWM"
cheatsheet = "cheatsheets/stm32g4-tim.toml"
doc_section = "RM0440 TIM sections"
hal_functions = ["HAL_TIM_PWM_Start", "__HAL_TIM_SET_COMPARE", "HAL_TIMEx_PWMN_Start"]
key_registers = ["TIMx_PSC", "TIMx_ARR", "TIMx_CCR1"]
confidence = "verified"
common_mistake = ["Timer clock = PCLK×2 when the APB prescaler ≠ 1 (up to 170 MHz); TIM2 is the only 32-bit timer; channel pins come from the datasheet AF table (e.g. TIM3_CH2 = PA4/PA7/PB5/PC7 AF2) — never from memory."]

[[stm32.g4.quickref]]
topic = "GPIO / EXTI"
cheatsheet = "cheatsheets/stm32g4-gpio.toml"
doc_section = "RM0440 GPIO"
confidence = "verified"
common_mistake = ["G4 pins come up in ANALOG mode after reset (not floating input like F1/F4); 16 EXTI lines shared across ports — one pin per line."]

[[stm32.g4.quickref]]
topic = "ADC"
cheatsheet = "cheatsheets/stm32g4-adc.toml"
doc_section = "DS12589 ADC / RM0440 ADC"
hal_functions = ["HAL_ADCEx_Calibration_Start", "HAL_ADC_Start_DMA", "HAL_ADCEx_OversamplingConfig"]
confidence = "verified"
common_mistake = ["G431 has 2× 12-bit ADCs (4 Msps, up to 16-bit via hardware oversampling); calibration is REQUIRED; sampling time must fit the source impedance."]

[[stm32.g4.quickref]]
topic = "FLASH / persistence"
cheatsheet = "cheatsheets/stm32g4-flash.toml"
doc_section = "RM0440 Flash"
hal_functions = ["HAL_FLASH_Program", "HAL_FLASHEx_Erase"]
key_registers = ["FLASH_CR", "FLASH_SR"]
confidence = "verified"
common_mistake = ["G431: single bank, NO read-while-write; 2 KB pages, 8-byte double-word programming; erase/program only in voltage range 1; unlock before use."]

[[stm32.g4.quickref]]
topic = "IWDG / reset cause"
cheatsheet = "cheatsheets/stm32g4-iwdg.toml"
doc_section = "RM0440 IWDG / RCC_CSR"
hal_functions = ["HAL_IWDG_Init", "HAL_IWDG_Refresh"]
key_registers = ["IWDG_PR", "IWDG_RLR", "IWDG_WINR", "RCC_CSR"]
confidence = "verified"
common_mistake = ["IWDG runs on LSI (~32 kHz), not SYSCLK; window mode resets on early refresh too; read RCC_CSR at startup to distinguish wake-from-standby vs watchdog trip."]

[[stm32.g4.quickref]]
topic = "Math accelerator"
doc_section = "RM0440 Section 8 (CORDIC) / 9 (FMAC)"
hal_functions = ["HAL_CORDIC_Calculate", "HAL_FMAC_Process"]
confidence = "verified"
notes = "CORDIC (sin/cos/atan/vector) and FMAC (FIR/IIR) are hardware math units unique to G4 — offload DSP loops instead of libm"

