last_reviewed = "2026-08-08"

[[stm32.g0.quickref]]
topic = "GPIO / EXTI"
cheatsheet = "cheatsheets/stm32g0-gpio.toml"
doc_section = "RM0444 GPIO/EXTI"
key_concepts = ["5V tolerance (per datasheet FT marking)", "EXTI wake-up"]
confidence = "verified"
notes = "SYSCLK up to 64MHz; STOP wake-up needs both the EXTI line and its clock enabled"

[[stm32.g0.quickref]]
topic = "USART / LPUART"
cheatsheet = "cheatsheets/stm32g0-uart.toml"
