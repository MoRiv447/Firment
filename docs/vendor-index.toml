# Firment hardware knowledge base — machine-readable index (seed KB)
# Consumption order (go layer by layer; never read the whole docs/ at once,
# or you will dump the entire KB back into context):
#   1) read_file("docs/vendor-index.toml")        -> find the target family / topic
#   2) read_file("docs/cheatsheets/<file>.toml")  -> original high-frequency cheatsheet
#   3) only for bitfields / deeper detail, fetch the official manual via reference_manual.url
# Rules: verifiable facts only; cheatsheet content must be original, never copy
# vendor documentation verbatim.
# Note: this seed KB ships with Firment; a real project KB lives in your project's
# docs/ (see vendor-index.md for the rules).

[meta]
schema_version = "1"
description = "Lightweight index + structured cheatsheets giving firm embedded-domain expertise. Manuals are not stored; only official entry URLs are kept."

# ───────────────────────── STM32 ─────────────────────────
[stm32.f4]
family = "STM32F4xx"
reference_manual = { name = "RM0090", url = "https://www.st.com/resource/en/reference_manual/rm0090-stm32f405415-stm32f407417-stm32f427437-and-stm32f429439-advanced-armbased-32bit-mcus-stmicroelectronics.pdf", pages = 1704 }
hal_repo = "https://github.com/STMicroelectronics/STM32CubeF4"
hal_header_path = "Drivers/STM32F4xx_HAL_Driver/Inc/stm32f4xx_hal_dma.h"
sdk_version = "STM32CubeF4 HAL v1.8.x"
last_reviewed = "2026-08-08"

[[stm32.f4.quickref]]
topic = "DMA configuration"
cheatsheet = "cheatsheets/stm32-dma.toml"
doc_section = "RM0090 Section 10.3"
hal_functions = ["HAL_DMA_Init", "HAL_DMA_Start_IT", "HAL_DMA_Start", "HAL_DMA_Abort"]
key_registers = ["DMA_SxCR", "DMA_SxNDTR", "DMA_SxPAR", "DMA_SxM0AR"]
confidence = "verified"
notes = "DMA1 master port sits on AHB1 (APB1/APB2 peripherals reachable via bridge), DMA2 sits on AHB2 (includes USB OTG HS / ETH / DCMI). USB/ETH/DCMI data must use a DMA2 stream."

[[stm32.f4.quickref]]
topic = "GPIO / EXTI"
cheatsheet = "cheatsheets/stm32f4-gpio.toml"
doc_section = "RM0090 GPIO"
confidence = "verified"
common_mistake = ["F407 has GPIOA-H; most pins 5 V tolerant but check FT per pin; PA13/14 = SWD, PH0/1 = HSE; pins come up as floating input."]

[[stm32.f4.quickref]]
topic = "TIM / PWM"
cheatsheet = "cheatsheets/stm32f4-tim.toml"
doc_section = "RM0090 TIM"
hal_functions = ["HAL_TIM_PWM_Start", "__HAL_TIM_SET_COMPARE", "HAL_TIMEx_PWMN_Start"]
key_registers = ["TIMx_PSC", "TIMx_ARR", "TIMx_CCR1"]
confidence = "verified"
common_mistake = ["TIM2/5 are 32-bit; timer clock = PCLK×2 when the APB prescaler ≠ 1 (TIM2-5 @84 MHz, TIM1/8 @168 MHz on F407); advanced timers need MOE for complementary outputs."]

[[stm32.f4.quickref]]
topic = "Clock tree"
cheatsheet = "cheatsheets/stm32-clock.toml"
doc_section = "RM0090 Section 6.2"
key_concepts = ["SYSCLK", "HCLK", "PCLK1", "PCLK2", "PLL"]
confidence = "verified"
common_mistake = ["Timer clocks on APB1/APB2 are PCLK×2 when the corresponding APB prescaler ≠ 1; computing TIM frequency directly from PCLK1=42MHz halves it (actual 84MHz)."]

# ───────────────────────── ESP32 ─────────────────────────
[esp32]
family = "ESP32 (ESP32-D0WD / ESP32-D0WDQ6)"
reference_manual = { name = "ESP32 Technical Reference Manual", url = "https://www.espressif.com/sites/default/files/documentation/esp32_technical_reference_manual_en.pdf", pages = 850 }
hal_repo = "https://github.com/espressif/esp-idf"
sdk_version = "ESP-IDF v5.x"
last_reviewed = "2026-08-08"

[[esp32.quickref]]
topic = "GPIO"
cheatsheet = "cheatsheets/esp32-gpio.toml"
doc_section = "ESP32 TRM Section 5 (GPIO and IOMUX)"
key_registers = ["GPIO_OUT", "GPIO_IN", "GPIO_ENABLE", "GPIO_<n>_CFG"]
confidence = "verified"
common_mistake = ["GPIO 34-39 are input-only: no output or internal pull-up/pull-down; strapping pins (GPIO 0/2/4/5/12/15) sampled at reset determine boot mode and voltage selection — hard-driving them can brick the board or block flashing."]

[[esp32.quickref]]
topic = "UART"
cheatsheet = "cheatsheets/esp32-uart.toml"
doc_section = "ESP32 TRM UART"
confidence = "verified"
common_mistake = ["UART0 console defaults to GPIO1(TX)/GPIO3(RX) — remapping it silences the boot console; any GPIO can carry UART signals via the matrix."]

[[esp32.quickref]]
topic = "ADC"
cheatsheet = "cheatsheets/esp32-adc.toml"
doc_section = "ESP32 TRM ADC"
confidence = "verified"
common_mistake = ["ADC2 (GPIO0/2/4/12-15/25-27) is unusable while WiFi is active; ADC1 (GPIO32-39, input-only) is the safe choice; use esp_adc_cal for real voltages."]

[[esp32.quickref]]
topic = "SPI"
cheatsheet = "cheatsheets/esp32-spi.toml"
doc_section = "ESP32 TRM SPI"
confidence = "verified"
common_mistake = ["HSPI defaults: SCLK14/MISO12/MOSI13/CS15, VSPI: SCLK18/MISO19/MOSI23/CS5; SPI0/1 are the flash bus — user code must use SPI2/SPI3."]

