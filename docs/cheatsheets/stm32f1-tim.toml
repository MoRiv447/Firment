# stm32f1-tim.toml — STM32F1 TIM/PWM original cheatsheet (engineering experience + RM0008)
[meta]
family = "STM32F1xx (F103)"
topic = "TIM / PWM"
confidence = "verified"
last_reviewed = "2026-08-08"
source = "Engineering experience cross-checked with RM0008"

[overview]
tim1 = "Advanced timer: APB2 (72MHz), 16-bit, with complementary outputs/brake input/dead-time; good for motors"
tim2_4 = "General-purpose timers: APB1, clock is PCLK1 when the APB1 prescaler is 1, otherwise PCLK1×2 (typically 72MHz)"
formula = "PWM frequency = timer clock / ((PSC+1) × (ARR+1)); duty cycle = compare value / (ARR+1)"

[hal_flow]
init = "HAL_TIM_PWM_Init + HAL_TIM_PWM_Start(htim, TIM_CHANNEL_x)"
set = "__HAL_TIM_SET_COMPARE(htim, TIM_CHANNEL_x, value)"
advanced = "TIM1 complementary outputs use HAL_TIMEx_PWMN_Start() and need the main output enabled with __HAL_TIM_MOE_ENABLE()"

common_mistake = [
  "Computing TIM2-4 with PCLK1=36MHz directly — it is actually 72MHz",
  "PSC/ARR are 16-bit (max 65535); raise PSC when low frequencies need a large ARR",
  "Adjusting TIM1 COMPARE without touching MOE leaves the complementary channels silent",
]
