# stm32f1-tim.toml — STM32F1 TIM/PWM 原创速查（工程经验 + RM0008 核对）
[meta]
family = "STM32F1xx (F103)"
topic = "TIM / PWM"
confidence = "verified"
last_reviewed = "2026-08-08"
source = "工程经验 + RM0008 核对"

[overview]
tim1 = "高级定时器：APB2（72MHz），16 位，带互补输出/刹车输入/死区，适合电机"
tim2_4 = "通用定时器：APB1，时钟在 APB1 预分频=1 时为 PCLK1，否则 PCLK1×2（典型 72MHz）"
formula = "PWM 频率 = 定时器时钟 / ((PSC+1) × (ARR+1))；占空比 = 比较值/(ARR+1)"

[hal_flow]
init = "HAL_TIM_PWM_Init + HAL_TIM_PWM_Start(htim, TIM_CHANNEL_x)"
set = "__HAL_TIM_SET_COMPARE(htim, TIM_CHANNEL_x, value)"
advanced = "TIM1 互补输出用 HAL_TIMEx_PWMN_Start()，且需使能主输出 __HAL_TIM_MOE_ENABLE()"

common_mistake = [
  "用 PCLK1=36MHz 直接算 TIM2-4——实际是 72MHz",
  "PSC/ARR 都是 16 位（上限 65535），低频要求高 ARR 时记得提 PSC",
  "TIM1 只调 COMPARE 不动 MOE，互补通道无输出",
]
