# stm32g0-gpio.toml — STM32G0 GPIO/EXTI original cheatsheet (engineering experience + RM0444)
[meta]
family = "STM32G0xx"
topic = "GPIO / EXTI"
confidence = "verified"
last_reviewed = "2026-08-08"
source = "Engineering experience cross-checked with RM0444"

[overview]
clock = "SYSCLK up to 64MHz (G0B1/G0C1 etc., per part); AHB/APB run at the same frequency"
gpio = "Ports PA/PB/PC/PD (per part); most pins are 5V tolerant except some analog/USB-related pins — check the datasheet"
exti = "Each GPIO line can select rising/falling/both-edge triggering for wake-up and interrupts"

[hal_flow]
init = "HAL_GPIO_Init(GPIOx, &GPIO_InitStruct{Mode, Pull, Speed}); EXTI callback is HAL_GPIO_EXTI_Callback(GPIO_Pin)"
wakeup = "STOP-mode wake-up needs the matching EXTI line enabled and the peripheral clock kept on in RCC"

common_mistake = [
  "Driving non-5V-tolerant pins with 5V logic — check the FT marking in the datasheet first",
  "Input-only/floating pins without pull-up/pull-down read noisy values",
  "Enabling only the interrupt for wake-up without the matching clock/line lets STOP sleep forever",
]
