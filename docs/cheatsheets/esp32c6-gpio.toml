# esp32c6-gpio.toml — ESP32-C6 GPIO/platform original cheatsheet (engineering experience + ESP32-C6 datasheet v1.5 / ESP-IDF docs)
[meta]
family = "ESP32-C6"
topic = "GPIO / platform"
confidence = "verified"
last_reviewed = "2026-08-18"
source = "Engineering experience cross-checked with the ESP32-C6 datasheet v1.5 and ESP-IDF GPIO documentation"

[overview]
core = "RISC-V single-core 160 MHz; WiFi 6 (802.11ax) + Bluetooth 5 LE + Zigbee/Thread (802.15.4); QFN40 (5x5 mm) or QFN32 package"
gpios = "GPIO0-GPIO30 pads; SiP-flash variants (C6FH4/FH8) do NOT lead out GPIO10/11 (22 usable); non-SiP variants do NOT lead out GPIO14 (30 usable); GPIO24-30 are the SPI0/1 flash bus"
input_only = "NONE: every exposed pad can be an output — but GPIO24-30 are the SPI flash bus (SiP flash is hard-wired) and GPIO27 is VDD_SPI by default"
drive = "Default drive strength 20 mA (GPIO12/13 default 40 mA)"
voltage = "3.3 V I/O; NOT 5 V tolerant"

[key_pins]
strapping = "GPIO4, GPIO5, GPIO8, GPIO9, GPIO15 (boot mode / JTAG / SDIO / ROM-print selectors); sampled at reset then free as GPIO; hard-driving them at reset can block flashing"
download = "GPIO8 HIGH + GPIO9 LOW at reset enters UART download boot; leave strapping pins un-driven during reset for normal flash boot"
usb = "Built-in USB-Serial/JTAG controller on GPIO12 (D-) / GPIO13 (D+); using 12/13 as plain GPIO disables USB-JTAG"
console = "UART0 default console: GPIO16 (TX) / GPIO17 (RX)"
jtag = "GPIO4 (MTMS) / GPIO5 (MTDI) / GPIO6 (MTCK) / GPIO7 (MTDO) are the JTAG pins"
adc = "ADC1 only: GPIO0-6 = ADC1_CH0-6 (7 channels, 12-bit SAR)"
xtal32k = "GPIO0/GPIO1 double as XTAL_32K_P/XTAL_32K_N for an external 32.768 kHz crystal"
lp_gpio = "GPIO0-7 are LP GPIOs (ULP LP-core, deep sleep); LP_I2C on GPIO6 (SDA)/GPIO7 (SCL); LP_UART on GPIO4 (RXD)/GPIO5 (TXD)/GPIO2 (RTSN)/GPIO3 (CTSN)"
vdd_spi = "GPIO27 is the VDD_SPI power pin by default (powers off-package flash); usable as GPIO only when the flash is powered externally"

common_mistake = [
  "Treating GPIO24-30 as free pins — they are the SPI flash bus (SiP flash parts hard-wire them; off-package parts use them for flash)",
  "Hard-driving strapping pins (GPIO4/5/8/9/15) at reset — can put the chip into download mode or block flashing",
  "Expecting 5 V tolerance — C6 I/O is 3.3 V only",
  "Claiming GPIO2/8/9 are the C6 strapping pins (that is ESP32-C3!) — C6 strapping is GPIO4/5/8/9/15",
  "Reusing GPIO12/13 for UART/sensors and then wondering why USB flashing broke — USB-JTAG owns them by default",
  "Using GPIO0/1 while a 32.768 kHz crystal is wired — they are the 32K crystal pins",
]