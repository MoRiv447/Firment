# stm32g4-uart.toml — STM32G4 USART/DMA original cheatsheet (engineering experience + RM0440)
[meta]
family = "STM32G4xx (G431/G474)"
topic = "USART / DMA / LPUART"
confidence = "verified"
last_reviewed = "2026-08-12"
source = "Engineering experience cross-checked with RM0440"

[overview]
usarts = "G4x1/G4x3 have USART1/2/3 + UART4 + LPUART1 (LPUART1 shares USART3 pin options via AF switch in some packages)"
clock = "USART1 on APB2, USART2/3/UART4/LPUART1 on APB1; both APB clocks are configurable (PCLK1/PCLK2 up to 170 MHz) — compute BRR from the ACTUAL peripheral clock, not a fixed 36/72 MHz assumption"
lpuart = "LPUART1 is a low-power UART whose kernel clock can come from LSE (32.768 kHz) or LSI; baud becomes quantized at low clocks — verify the actual rate, don't assume exact 9600"

[hal_flow]
init = "MX_USARTx_UART_Init / HAL_UART_Init configure baud/word length/stop bits; transmit with HAL_UART_Transmit(_IT/_DMA)"
dma_tx = "HAL_UART_Transmit_DMA(huart, buf, len) + the transfer-complete interrupt; remember __HAL_DMA_ENABLE_IT(TC) on the used DMA stream"
dma_rx = "HAL_UART_Receive_DMA() is fixed-length; variable-length receive uses the IDLE line interrupt + DMA remaining-data counter"

[dma_mapping]
note = "CRITICAL: G4 uses a DMAMUX — unlike F1/F4 there is NO fixed peripheral-to-channel mapping. Every DMA request (e.g. USART1_TX) is routed to ANY free DMA1/DMA2 channel by writing DMAMUX1_REQx. Wrong 'channel' thinking from F1 code does not apply."
example = "USART1_TX -> DMAMUX1_REQ0 -> pick DMA1_Channel1; the same request can go to any channel; the mapping lives in the DMAMUX registers, not in the channel number"
dma_mux_registers = ["DMAMUX1_REQ0..", "DMAMUX1_C0CR .. C7CR"]
dma_requests = "USART1_TX=DMAMUX1_REQ0, USART1_RX=DMAMUX1_REQ1, USART2_TX=REQ4, USART2_RX=REQ5 (verify against RM0440 Table 60 for the exact part)"

[common_mistake]
- "Porting F1/F4 code and 'knowing' USART1_TX must be DMA channel 4 — G4 has no fixed channel; the DMAMUX decides"
- "Computing BRR from a hardcoded 72 MHz PCLK — G4 APB clocks are programmable; read the actual clock (SystemCoreClock / APB prescalers)"
- "Forgetting to configure the DMAMUX request: HAL_UART_Transmit_DMA works only after the request routing is set up"
- "Enabling DMA but not __HAL_RCC_DMA1_CLK_ENABLE() (and the DMAMUX clock on parts where it is gated)"
