# stm32-clock.toml — STM32F4 RCC / clock tree original cheatsheet (no copyright risk)
[meta]
family = "STM32F4xx"
topic = "RCC / clock tree"
confidence = "verified"
last_reviewed = "2026-08-08"
source = "Engineering experience cross-checked with RM0090 Section 6"

[overview]
sources = "HSI (16MHz internal RC) / HSE (external crystal, typically 8/25MHz) / PLL (multiplication)"
max_freq = "SYSCLK up to 168MHz (F405/407/415/417); other F4 variants follow their own RM"
buses = "AHB1 / AHB2 / AHB3(FSMC/FMC) + APB1 + APB2"

[path]
SYSCLK = "one of HSI/HSE/PLL (RCC_CFGR.SW)"
HCLK = "SYSCLK / AHB prescaler (RCC_CFGR.HPRE); drives the CPU and AHB bus"
PCLK1 = "HCLK / APB1 prescaler (PPRE1); peripherals up to 42MHz"
PCLK2 = "HCLK / APB2 prescaler (PPRE2); peripherals up to 84MHz"
timer_clock = "Timers on APB1/APB2: equal to PCLK when the APB prescaler is 1, otherwise PCLK×2"

[hal_flow]
init = "HAL_RCC_OscConfig({HSEState/HSIState on, PLL.PLLM/PLLN/PLLP/PLLQ}) -> HAL_RCC_ClockConfig({AHBCLKDivider, APB1CLKDivider, APB2CLKDivider, FlashLatency})"
flash_latency = "168MHz needs FLASH_LATENCY_5; higher frequency requires higher latency or instruction fetch HardFaults"
periph_clock = "enable each peripheral clock with __HAL_RCC_xxx_CLK_ENABLE(); otherwise register writes silently do nothing"

common_mistake = [
  "Forgetting the ×2 when computing timer frequency: with APB1 PCLK1=42MHz the TIM clock is actually 84MHz",
  "PLLM dividing HSE too low makes the PLL input <1MHz and unstable; after PLLN the VCO must stay in 192-432MHz",
  "Changing clocks without adjusting Flash latency HardFaults instruction fetch at high frequency",
  "Missing __HAL_RCC_xxx_CLK_ENABLE() makes peripheral register writes silently ineffective",
]
