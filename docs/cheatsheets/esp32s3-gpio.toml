# esp32s3-gpio.toml — ESP32-S3 GPIO original cheatsheet (engineering experience + ESP32-S3 TRM)
[meta]
family = "ESP32-S3"
topic = "GPIO"
confidence = "verified"
last_reviewed = "2026-08-08"
source = "Engineering experience cross-checked with the ESP32-S3 Technical Reference Manual"

[overview]
gpios = "45 GPIOs: GPIO0-21 and GPIO26-48; 3.3V logic, most are not 5V tolerant (check the datasheet)"
matrix = "The GPIO matrix routes any peripheral signal to any pin; direct IOMUX has lower latency"
usb = "Built-in USB-Serial/JTAG: default GPIO19(D-) / GPIO20(D+)"

[key_pins]
strapping = "GPIO0 (download mode) / GPIO3 / GPIO45 / GPIO46 are strapping pins; reset levels decide boot behavior"
console = "Default UART0 console: GPIO43(TX) / GPIO44(RX)"

common_mistake = [
  "Driving 3.3V pins with 5V as if they were tolerant — most S3 pins are not 5V tolerant",
  "Occupying GPIO43/44 silences the default console",
  "Hard-driving strapping pins (especially GPIO0) blocks download mode",
]
