# esp32-gpio.toml — ESP32 GPIO / IOMUX original cheatsheet (no copyright risk; engineering experience)
[meta]
family = "ESP32 (ESP32-D0WD / ESP32-D0WDQ6)"
topic = "GPIO"
confidence = "verified"
last_reviewed = "2026-08-08"
source = "Engineering experience cross-checked with ESP32 TRM Section 5"

[overview]
physical = "40 GPIO pads total (numbered 0-39); 34-39 are input-only"
matrix = "The GPIO matrix routes any peripheral signal to any GPIO; some signals have lower latency via direct IOMUX"
strapping = "GPIO 0 / 2 / 4 / 5 / 12(MTDI) / 15(MTDO) are strapping pins sampled at reset: GPIO0/2/5/12/15 affect boot/download mode and log output; GPIO4 selects VDD_SDIO voltage, GPIO12(MTDI) selects flash voltage; GPIO 6-11 are SPI flash pins, not strapping"

[key_pins]
input_only = "GPIO 34,35,36,37,38,39 — input only; no output and no internal pull-up/pull-down"
uart0 = "GPIO 1(TX)/3(RX) are the default console; debug prints use them"
spi_flash = "GPIO 6-11 are wired to SPI flash by default; using them as normal GPIOs crashes the chip (unless octal flash frees some of them)"

[hal_flow]
init = "gpio_config({pin_bit_mask, mode(INPUT/OUTPUT), pull_up_en/pull_down_en, intr_type}); then gpio_set_level() / gpio_get_level() in ESP-IDF"
matrix_route = "Peripheral drivers go through the GPIO matrix automatically; use gpio_matrix_out() / gpio_matrix_in() for special needs"
pwm = "Generate PWM with LEDC (ledc_timer_config + ledc_channel_config), not by toggling GPIOs in a timer ISR"

common_mistake = [
  "Using GPIO 34-39 as outputs — hardware does not support it and the config silently fails",
  "Hard-driving strapping pins prevents re-entering download mode (the correct levels must be held during manual reset)",
  "Pull-ups do nothing on input-only pins; floating reads are noisy",
  "Mixing IO_MUX and GPIO matrix routing conflicts with the same signal",
]
