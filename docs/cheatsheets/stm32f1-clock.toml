# stm32f1-clock.toml — STM32F1 RCC/clock tree original cheatsheet (engineering experience + RM0008)
[meta]
family = "STM32F1xx (F103)"
topic = "RCC / clock tree"
confidence = "verified"
last_reviewed = "2026-08-08"
source = "Engineering experience cross-checked with RM0008 Section 7"

[overview]
sources = "HSI (8MHz RC) / HSE (4-16MHz crystal) / PLL (typically HSE×9=72MHz)"
max_freq = "SYSCLK up to 72MHz (F103); AHB=72MHz, APB1≤36MHz, APB2≤72MHz"

[path]
SYSCLK = "one of HSI/HSE/PLL (RCC_CFGR.SW)"
HCLK = "SYSCLK / AHB prescaler"
PCLK1 = "HCLK / APB1 prescaler; peripherals up to 36MHz"
PCLK2 = "HCLK / APB2 prescaler; peripherals up to 72MHz"
timer_clock = "Timers on APB1/APB2: equal to PCLK when the APB prescaler is 1, otherwise PCLK×2"

[hal_flow]
init = "HAL_RCC_OscConfig({HSEState on, PLL.PLLSource=HSE, PLLMUL=x9}) → HAL_RCC_ClockConfig({SYSCLKSource=PLLCLK, AHB=1, APB1=2, APB2=1, FlashLatency=2})"
flash_latency = "72MHz needs 2 wait states (at 3.3V) or instruction fetch HardFaults"

common_mistake = [
  "PCLK1 above 36MHz makes APB1 peripherals (USART, TIM2-4, ...) behave erratically",
  "Forgetting to adjust Flash latency after overclocking",
  "Not checking the HAL_RCC_OscConfig return value when HSE fails to start, then continuing with an invalid PLL",
]
