# stm32f1-uart.toml — STM32F1 USART/DMA original cheatsheet (engineering experience + RM0008)
[meta]
family = "STM32F1xx (F103)"
topic = "USART / DMA"
confidence = "verified"
last_reviewed = "2026-08-08"
source = "Engineering experience cross-checked with RM0008"

[overview]
usarts = "F103 typically has 3 USARTs: USART1 on APB2 (72MHz), USART2/3 on APB1 (36MHz); F105/107 also have UART4/5"
clock = "Baud rate follows the peripheral clock: USART1 uses PCLK2=72MHz, USART2/3 use PCLK1=36MHz"

[hal_flow]
init = "MX_USARTx_UART_Init / HAL_UART_Init configure baud, word length, stop bits; transmit with HAL_UART_Transmit(_IT/_DMA)"
dma_tx = "HAL_UART_Transmit_DMA(huart, buf, len); enable the transfer-complete interrupt with __HAL_DMA_ENABLE_IT(TC)"
dma_rx = "HAL_UART_Receive_DMA() is fixed-length; variable-length receive usually combines the idle interrupt (IDLE) with the DMA remaining-counter"

[dma_channels]
note = "F103 has only DMA1 (7 channels); the mapping is fixed per peripheral — wrong channel = no transfer"
USART1_TX = "DMA1 Channel 4"
USART1_RX = "DMA1 Channel 5"
USART2_TX = "DMA1 Channel 7"
USART2_RX = "DMA1 Channel 6"
USART3_TX = "DMA1 Channel 2"
USART3_RX = "DMA1 Channel 3"

common_mistake = [
  "Computing USART2/3 baud with 72MHz — it is actually PCLK1=36MHz",
  "USART1_TX is Ch4, not Ch5; the DMA never triggers when swapped",
  "Enabling DMA but forgetting __HAL_RCC_DMA1_CLK_ENABLE(), so registers silently do nothing",
]
