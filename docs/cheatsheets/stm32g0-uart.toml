# stm32g0-uart.toml — STM32G0 USART/LPUART original cheatsheet (engineering experience + RM0444)
[meta]
family = "STM32G0xx"
topic = "USART / LPUART"
confidence = "verified"
last_reviewed = "2026-08-08"
source = "Engineering experience cross-checked with RM0444"

[overview]
usarts = "2-4 USARTs depending on the part; plus LPUART1 (low power, can run in STOP mode)"
clock_src = "USART clock can be PCLK / HSI16 / LSE (LPUART commonly uses LSE 32.768kHz for ultra-low-power serial; baud is then limited)"

[hal_flow]
init = "HAL_UART_Init / HAL_LPUART_Init configure baud and data format"
low_power = "LPUART1 on LSE has a low baud ceiling (commonly 9600); for STOP wake-up use HAL_LPUART_Receive_IT + EXTI"

common_mistake = [
  "Computing a high LPUART baud from PCLK=64MHz — impossible on the LSE clock",
  "Forgetting to select the USART clock source in RCC (PCLK vs HSI16 vs LSE)",
  "Enabling only the LPUART interrupt for wake-up without the related EXTI/clock — cannot wake from STOP",
]
