# stm32-dma.toml — STM32F4 DMA original cheatsheet (no copyright risk; compiled from engineering experience)
[meta]
family = "STM32F4xx"
topic = "DMA"
confidence = "verified"
last_reviewed = "2026-08-08"
source = "Engineering experience cross-checked with RM0090"

[overview]
controllers = "2 DMA controllers (DMA1 / DMA2), 8 streams each (S0-S7)"
channel = "Each stream selects 1 of 8 channel requests (peripheral source) via DMA_SxCR.CHSEL; stream/channel combos must follow the DMA request mapping table in the RM"
transfer = "peripheral<->memory / memory<->memory; supports FIFO and direct modes, circular (CIRC) and double-buffer (DBM)"
width = "PSIZE/MSIZE are set independently to byte/half-word/word; mismatched source/target widths are packed by hardware to the target width — watch alignment to avoid bus faults"

[key_registers]
DMA_SxCR = "stream control: EN / DIR / PINC / MINC / CIRC / DBM / PL[1:0] / CHSEL / TCIE / HTIE / TEIE"
DMA_SxNDTR = "remaining transfer items; writing 0 does not self-start, EN=1 required; reaching 0 raises the TC interrupt"
DMA_SxPAR = "peripheral address (source in peripheral-to-memory mode)"
DMA_SxM0AR = "memory address 0 (DMA_SxM1AR is buffer 1 in double-buffer mode)"

[hal_flow]
init = "Fill DMA_HandleTypeDef (Instance=DMAx_Streamy, Channel=CHSEL, Direction, PINC/MINC, ...) -> HAL_DMA_Init() -> link the handle via peripheral drivers such as HAL_xxx_Transmit_DMA / Receive_DMA / ADC_Start_DMA"
interrupt = "HAL_DMA_Start_IT() starts the transfer and enables TC/HT/TE interrupts; completion callback is HAL_DMA_XferCpltCallback()"
link_to_peripheral = "DMA only moves data; requests come from the peripheral (UART/ADC/TIM), so the peripheral clock and the DMA clock must both be enabled"

common_mistake = [
  "Two peripherals sharing one stream conflict in hardware — check the RM DMA request mapping table before picking stream/channel",
  "Before changing NDTR or restarting a transfer, clear EN=0 and poll until EN reads 0 (hardware clears the EN bit with delay), or the configuration will not take effect",
  "DMA1 cannot reach AHB2 peripherals (USB OTG HS / ETH / DCMI); those must use DMA2",
  "A peripheral address not aligned to its width (e.g. an odd address for a half-word peripheral) triggers a BusFault",
]

[gotchas]
bus_matrix = "DMA1->AHB1, DMA2->AHB2; APB1/APB2 peripherals are reachable by DMA1 through the bridge, AHB2-only peripherals by DMA2 only"
cache = "F4 has no D-Cache (F7/H7 do), so F4 usually needs no DMA buffer flush; on H7 use SCB_Clean/Invalidate DCache"
