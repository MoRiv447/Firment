# esp32s3-uart.toml — ESP32-S3 UART/USB 原创速查（工程经验 + ESP32-S3 TRM 核对）
[meta]
family = "ESP32-S3"
topic = "UART / USB-Serial"
confidence = "verified"
last_reviewed = "2026-08-08"
source = "工程经验 + ESP32-S3 TRM 核对"

[overview]
uarts = "3 个 UART（UART0/1/2）+ USB Serial/JTAG（CDC）"
console = "默认 log 走 UART0（GPIO43/44）；也可把 console 改到 USB-Serial/JTAG（idf.py monitor 直连）"

[hal_flow]
init = "ESP-IDF：uart_driver_install() + uart_param_config() + uart_write_bytes()"
usb = "USB-CDC 用 usb_serial_jtag 驱动，注意与 JTAG 复用同一物理口"

common_mistake = [
  "log 同时开 UART0 和 USB-CDC 导致输出混乱——二选一",
  "UART 波特率与工具不匹配（monitor 默认 115200）",
  "RX/TX 接反或与 USB 口混用",
]
