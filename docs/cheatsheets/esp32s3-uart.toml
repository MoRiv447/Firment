# esp32s3-uart.toml — ESP32-S3 UART/USB original cheatsheet (engineering experience + ESP32-S3 TRM)
[meta]
family = "ESP32-S3"
topic = "UART / USB-Serial"
confidence = "verified"
last_reviewed = "2026-08-08"
source = "Engineering experience cross-checked with the ESP32-S3 TRM"

[overview]
uarts = "3 UARTs (UART0/1/2) + USB Serial/JTAG (CDC)"
console = "Logs default to UART0 (GPIO43/44); the console can be switched to USB-Serial/JTAG (idf.py monitor connects directly)"

[hal_flow]
init = "ESP-IDF: uart_driver_install() + uart_param_config() + uart_write_bytes()"
usb = "USB-CDC uses the usb_serial_jtag driver; note it shares the same physical port as JTAG"

common_mistake = [
  "Enabling logs on both UART0 and USB-CDC garbles output — pick one",
  "UART baud mismatch with the tool (monitor defaults to 115200)",
  "RX/TX swapped or mixed up with the USB port",
]
