<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/logo-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* 收紧高度链：防止内容撑破 100vh 导致 body 出现滚动条/白底 */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #141414;
      }
      /* 全局滚动条美化（WebKit） */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #3a3a3a;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4a4a4a;
      }
    </style>

    <link rel="stylesheet" crossorigin href="/assets/index-BDNOyzxu.css">
  </head>

  </body>
</html>
