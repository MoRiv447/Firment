name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        shell: bash
        timeout-minutes: 20
        run: |
          set -e
          # Run each crate's tests serially to bound peak memory on hosted
          # runners (parallel test binaries previously OOM'd the job).
          for pkg in firment-core firment-tools firment-tui firment-cli; do
            echo "=== cargo test -p $pkg ==="
            cargo test -p "$pkg" -- --test-threads=1
          done
