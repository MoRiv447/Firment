name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (build only)
        shell: bash
        timeout-minutes: 12
        run: |
          free -m || true
          nproc || true
          echo "=== building (no-run) ==="
          timeout 600 cargo test --workspace --no-run 2>&1 || { echo "=== BUILD STEP FAILED/HUNG (exit $?) ==="; exit 1; }
          echo "=== build ok ==="
      - name: test (run)
        shell: bash
        timeout-minutes: 12
        run: |
          echo "=== Z: bare sleep control (no rust involved) ==="
          timeout 10 sleep 5 && echo "Z sleep ok" || { echo "=== Z FAILED (exit $?) ==="; exit 1; }
          echo "=== K: manual kill -9 -pgid inside plain bash (no rust) ==="
          sh -c 'sh -c "sleep 30" & CHILD=$!; sleep 1; kill -9 -$CHILD && echo "K group-kill ok"; wait; echo "K done"'
          echo "=== L: bash replica of guarded kill_process_tree ==="
          sh -c 'sleep 30' & CHILD=$!
          sleep 1
          OUR_PGID=$(ps -o pgid= -p $$ | tr -d ' ')
          CHILD_PGID=$(ps -o pgid= -p $CHILD | tr -d ' ')
          echo "L child=$CHILD our_pgid=$OUR_PGID child_pgid=$CHILD_PGID"
          if [ "$CHILD_PGID" -gt 1 ] && [ "$CHILD_PGID" != "$OUR_PGID" ]; then
            kill -9 -$CHILD_PGID && echo "L group-killed -$CHILD_PGID"
          else
            kill -9 $CHILD && echo "L killed direct $CHILD"
          fi
          wait 2>/dev/null; echo "L done"
          echo "=== L2: setsid child (own group) then group-kill ==="
          setsid sh -c 'sleep 30' & CHILD=$!
          sleep 1
          CHILD_PGID=$(ps -o pgid= -p $CHILD | tr -d ' ')
          echo "L2 child=$CHILD child_pgid=$CHILD_PGID"
          kill -9 -$CHILD_PGID; echo "L2 group-kill rc=$?"
          wait 2>/dev/null; echo "L2 done"
          echo "=== C: mem limits probe + 6GB alloc probe ==="
          cat /sys/fs/cgroup/memory.max 2>/dev/null; cat /sys/fs/cgroup/memory.high 2>/dev/null; free -m | grep -E 'Mem|Swap'
          timeout 60 python3 -c 'import time; a=bytearray(1024*1024*1024*6); time.sleep(10)' && echo "M 6GB ok" || echo "M 6GB failed rc=$?"
          echo "=== C: cancel test with --jobs 1 + memory watch ==="
          timeout 180 cargo test -p firment-tools --jobs 1 -- util::tests::cancel_stops -- --test-threads=1 2>&1 &
          CPID=$!
          while kill -0 $CPID 2>/dev/null; do
            free -m | awk '/Mem/{print "mem_avail=" $7}' >> /tmp/memlog.txt
            sleep 4
          done
          wait $CPID; RC=$?
          echo "C exit $RC"
          tail -5 /tmp/memlog.txt
          [ $RC -ne 0 ] && exit 1
          echo "=== D: timeout test alone (spawns sleep, kills tree) ==="
          timeout 120 cargo test -p firment-tools -- util::tests::timeout_kills -- --test-threads=1 2>&1 || { echo "=== D FAILED (exit $?) ==="; exit 1; }
          echo "=== E: util full (3 tests together) ==="
          timeout 120 cargo test -p firment-tools -- util:: -- --test-threads=1 2>&1 || { echo "=== E FAILED (exit $?) ==="; exit 1; }
          echo "=== F: tools full suite ==="
          timeout 600 cargo test -p firment-tools -- --test-threads=1 2>&1 || { echo "=== F FAILED (exit $?) ==="; exit 1; }
