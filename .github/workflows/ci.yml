name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (build only)
        shell: bash
        timeout-minutes: 12
        run: |
          free -m || true
          nproc || true
          echo "=== building (no-run) ==="
          timeout 600 cargo test --workspace --no-run 2>&1 || { echo "=== BUILD STEP FAILED/HUNG (exit $?) ==="; exit 1; }
          echo "=== build ok ==="
      - name: test (run)
        shell: bash
        timeout-minutes: 12
        run: |
          echo "=== Z: bare sleep control (no rust involved) ==="
          timeout 10 sleep 30 && echo "Z sleep ok" || { echo "=== Z FAILED (exit $?) ==="; exit 1; }
          echo "=== C: cancel test alone (spawns sleep, kills tree) ==="
          timeout 120 cargo test -p firment-tools -- util::tests::cancel_stops -- --test-threads=1 2>&1 || { echo "=== C FAILED (exit $?) ==="; exit 1; }
          echo "=== D: timeout test alone (spawns sleep, kills tree) ==="
          timeout 120 cargo test -p firment-tools -- util::tests::timeout_kills -- --test-threads=1 2>&1 || { echo "=== D FAILED (exit $?) ==="; exit 1; }
          echo "=== E: util full (3 tests together) ==="
          timeout 120 cargo test -p firment-tools -- util:: -- --test-threads=1 2>&1 || { echo "=== E FAILED (exit $?) ==="; exit 1; }
          echo "=== F: tools full suite ==="
          timeout 600 cargo test -p firment-tools -- --test-threads=1 2>&1 || { echo "=== F FAILED (exit $?) ==="; exit 1; }
