name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libssl-dev
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        shell: bash
        timeout-minutes: 25
        run: |
          set -e
          # Run each crate's tests serially to bound peak memory on hosted
          # runners (parallel test binaries previously OOM'd the job).
          # Each crate also gets its own hard timeout so a hanging test
          # fails fast (exit 124) instead of silently burning the step budget.
          for pkg in firment-core firment-tools firment-tui firment-cli; do
            echo "=== cargo test -p $pkg ==="
            timeout 480 cargo test -p "$pkg" -- --test-threads=1
          done
      # The web build consumes a committed snapshot of the core tool specs
      # (web/src/lib/tools/specs.json, generated by `firm tools`). Fail if it
      # drifts from the registry, so a schema change in core can't silently
      # desync the web surface.
      - name: web tool-spec snapshot matches 'firm tools'
        shell: bash
        run: |
          cargo run -q -p firment-cli -- tools > /tmp/specs-live.json
          tr -d '\r' < web/src/lib/tools/specs.json > /tmp/specs-committed.json
          diff /tmp/specs-live.json /tmp/specs-committed.json

  # Web (Next.js): type-check + production build.
  web-check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  # GUI (Tauri): frontend type-check/build + src-tauri Rust check.
  gui-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Frontend check
        working-directory: gui
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri + firment-core Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config libudev-dev
      - name: Rust check (src-tauri)
        working-directory: gui/src-tauri
        run: |
          # fmt must be gated here: the root-workspace fmt job never covers
          # this independent workspace (AGENTS.md requires it locally).
          cargo fmt --check
          cargo check
