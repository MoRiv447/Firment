name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        shell: bash
        timeout-minutes: 25
        run: |
          set -e
          # Run each crate's tests serially to bound peak memory on hosted
          # runners (parallel test binaries previously OOM'd the job).
          # Each crate also gets its own hard timeout so a hanging test
          # fails fast (exit 124) instead of silently burning the step budget.
          for pkg in firment-core firment-tools firment-tui firment-cli; do
            echo "=== cargo test -p $pkg ==="
            timeout 480 cargo test -p "$pkg" -- --test-threads=1
          done

  # Web (Next.js): type-check + production build.
  web-check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  # IDE (Tauri): frontend type-check/build + src-tauri Rust check.
  ide-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ide/package-lock.json
      - name: Frontend check
        working-directory: ide
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri + firment-core Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config libudev-dev
      - name: Rust check (src-tauri)
        working-directory: ide/src-tauri
        run: cargo check
