name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: firm-x86_64-pc-windows-msvc.zip
            package: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: firm-x86_64-unknown-linux-gnu.tar.gz
            package: tar
          - os: macos-14
            target: aarch64-apple-darwin
            asset: firm-aarch64-apple-darwin.tar.gz
            package: tar
          - os: macos-14
            target: x86_64-apple-darwin
            asset: firm-x86_64-apple-darwin.tar.gz
            package: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          if [ "${{ matrix.package }}" = "zip" ]; then
            powershell -Command "Compress-Archive -LiteralPath 'target/${{ matrix.target }}/release/firm.exe' -DestinationPath 'dist/${{ matrix.asset }}' -Force"
          else
            tar -czf "dist/${{ matrix.asset }}" -C "target/${{ matrix.target }}/release" firm
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: dist/${{ matrix.asset }}

  # Windows desktop installer (Tauri/NSIS), shipped alongside the CLI on
  # every tag. `tauri build` runs the frontend build itself
  # (beforeBuildCommand: npm run build) then bundles src-tauri.
  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build GUI installer
        working-directory: gui
        shell: bash
        run: |
          npm ci
          npm run tauri build
      - name: Stage installer artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "gui/src-tauri/target/release/bundle/nsis/*-setup.exe" dist/
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: asset-gui-windows-setup
          path: dist/*.exe

  release:
    needs: [build, gui-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - name: Extract the tagged section from CHANGELOG.md as release notes
        shell: bash
        run: |
          # Headings follow "## vX.Y.Z (date) — title"; print everything from
          # this tag's heading up to the next one. When the tag has no section
          # yet (renamed late / typo), fall back to a pointer so the release
          # still publishes.
          TAG="${GITHUB_REF_NAME}"
          awk -v pat="^## ${TAG} " '$0 ~ pat {flag=1; next} /^## / {if (flag) exit} flag' \
            CHANGELOG.md > RELEASE_NOTES.md || true
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "_See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details._" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md
      - name: Remove empty placeholder release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json assets >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets | length')" -eq 0 ]; then
              gh release delete "$GITHUB_REF_NAME" --yes
            fi
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
