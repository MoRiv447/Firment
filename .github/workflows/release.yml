name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: firm-x86_64-pc-windows-msvc.zip
            package: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: firm-x86_64-unknown-linux-gnu.tar.gz
            package: tar
          - os: macos-14
            target: aarch64-apple-darwin
            asset: firm-aarch64-apple-darwin.tar.gz
            package: tar
          - os: macos-14
            target: x86_64-apple-darwin
            asset: firm-x86_64-apple-darwin.tar.gz
            package: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libssl-dev
      - name: Build
        # --locked: ci.yml audits the COMMITTED Cargo.lock, and without this a semver-compatible
        # bump re-resolves here and ships a dependency set nobody audited.
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          if [ "${{ matrix.package }}" = "zip" ]; then
            powershell -Command "Compress-Archive -LiteralPath 'target/${{ matrix.target }}/release/firm.exe' -DestinationPath 'dist/${{ matrix.asset }}' -Force"
          else
            tar -czf "dist/${{ matrix.asset }}" -C "target/${{ matrix.target }}/release" firm
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: dist/${{ matrix.asset }}

  # Windows desktop installer (Tauri/NSIS), shipped alongside the CLI on
  # every tag. `tauri build` runs the frontend build itself
  # (beforeBuildCommand: npm run build) then bundles src-tauri.
  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build GUI installer
        working-directory: gui
        shell: bash
        run: |
          npm ci
          # `--bundles nsis` rather than the config's "all": the WiX msi target refuses a
          # version with a non-numeric pre-release identifier ("must be numeric-only and
          # cannot be greater than 65535"), so an rc tag would fail the bundle step — and
          # the msi was never the artifact this job ships. The next step copies the NSIS
          # setup.exe and nothing else, so asking for exactly that is the honest form.
          npm run tauri build -- --bundles nsis
      - name: Stage installer artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "gui/src-tauri/target/release/bundle/nsis/*-setup.exe" dist/
          # NSIS names the bundle after the product name, and that name has a space in
          # it: `Firment GUI_1.0.0-rc_x64-setup.exe`. GitHub stores the uploaded asset
          # with the space turned into a dot, while SHA256SUMS is generated from the
          # name on disk -- so the two halves of one release called the same installer
          # by two names and its checksum could not be looked up. Both v1.0.0-rc and
          # v1.0.0-rc2 shipped that row. Flattening the name here removes the only
          # place the two can disagree.
          Get-ChildItem dist/*.exe | ForEach-Object {
            $flat = $_.Name -replace ' ', '.'
            if ($flat -ne $_.Name) { Rename-Item -LiteralPath $_.FullName -NewName $flat }
          }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: asset-gui-windows-setup
          path: dist/*.exe

  release:
    needs: [build, gui-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - name: Extract the tagged section from CHANGELOG.md as release notes
        shell: bash
        run: |
          # Headings follow "## vX.Y.Z (date) — title"; print everything from
          # this tag's heading up to the next one. When the tag has no section
          # yet (renamed late / typo), fall back to a pointer so the release
          # still publishes.
          TAG="${GITHUB_REF_NAME}"
          awk -v pat="^## ${TAG} " '$0 ~ pat {flag=1; next} /^## / {if (flag) exit} flag' \
            CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            # This used to write a link to CHANGELOG.md and publish happily. That is the
            # silently-skipped check AGENTS.md forbids: the release that reaches a user with no
            # section of its own gets the notes nobody wrote, and nothing downstream can tell --
            # `awk` exits 0 for an empty match, so even the `|| true` was never the failure
            # signal. The heading and the tag have to match character for character; say so and
            # stop, and let whoever tagged it fix the CHANGELOG or the tag.
            echo "::error::CHANGELOG.md has no \"## ${TAG} \" section -- the release notes would be a fallback nobody reviewed. Add the section (heading must match the tag exactly) or retag."
            exit 1
          fi
          cat RELEASE_NOTES.md
      - name: Remove empty placeholder release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json assets >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets | length')" -eq 0 ]; then
              gh release delete "$GITHUB_REF_NAME" --yes
            fi
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # A tag with a dash is a pre-release (`v1.0.0-rc`, `v2.0.0-beta.3`). Without this the
          # action files an ordinary release and the rc takes the "Latest" slot — which is what
          # someone clicking "latest" installs, and it is not what a candidate is for. Decided
          # from the ref name rather than by the action's own `auto` heuristic, so the rule is
          # readable here instead of living inside a dependency.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
      # The pair that drifted on two consecutive releases: `sha256sum *` writes the
      # names as they are on disk, and the assets are stored under the names GitHub
      # gave them. Check both directions against the live release, so a row that names
      # nothing -- or a binary that shipped without one -- fails the job instead of
      # teaching the next reader that SHA256SUMS is decorative.
      - name: Verify SHA256SUMS names the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          cd artifacts
          names="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          bad=0
          while read -r _ name; do
            [ -n "${name:-}" ] || continue
            [ "$name" = "SHA256SUMS" ] && continue
            if ! printf '%s\n' "$names" | grep -qxF "$name"; then
              echo "::error::SHA256SUMS names \"$name\", which is not an asset of $GITHUB_REF_NAME"
              bad=1
            fi
          done < SHA256SUMS
          while read -r asset; do
            [ -n "$asset" ] || continue
            [ "$asset" = "SHA256SUMS" ] && continue
            if ! awk -v a="$asset" '$2 == a { found = 1 } END { exit found ? 0 : 1 }' SHA256SUMS; then
              echo "::error::$asset shipped with no SHA256SUMS row"
              bad=1
            fi
          done <<< "$names"
          [ "$bad" -eq 0 ] && echo "SHA256SUMS and the published assets name the same files."
          exit $bad
