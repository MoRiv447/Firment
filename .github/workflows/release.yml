name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: firm-x86_64-pc-windows-msvc.zip
            package: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: firm-x86_64-unknown-linux-gnu.tar.gz
            package: tar
          - os: macos-14
            target: aarch64-apple-darwin
            asset: firm-aarch64-apple-darwin.tar.gz
            package: tar
          - os: macos-13
            target: x86_64-apple-darwin
            asset: firm-x86_64-apple-darwin.tar.gz
            package: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          if [ "${{ matrix.package }}" = "zip" ]; then
            powershell -Command "Compress-Archive -LiteralPath 'target/${{ matrix.target }}/release/firm.exe' -DestinationPath 'dist/${{ matrix.asset }}' -Force"
          else
            tar -czf "dist/${{ matrix.asset }}" -C "target/${{ matrix.target }}/release" firm
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
